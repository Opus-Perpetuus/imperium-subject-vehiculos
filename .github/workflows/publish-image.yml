name: publish-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  # `contents: write` para poder empujar el commit de release y su tag.
  contents: write
  packages: write
# Dos push seguidos no pueden pelearse por el mismo tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip image]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin la historia completa no hay tags y cada corrida pareceria el
          # primer release.
          fetch-depth: 0
      - name: Subir version por conventional commits
        id: release
        run: |
          set +e
          bash scripts/release.sh
          code=$?
          set -e
          if [ "$code" = "78" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nada que liberar; no se publica imagen." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Commit y tag de release
        if: steps.release.outputs.released == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          SRC_SHA="$(git rev-parse HEAD)"
          git fetch --tags --force origin
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            TAG_SHA="$(git rev-parse "v$VERSION^{commit}")"
            # Reintento: el tag puede apuntar al release cuyo primer padre es este SHA.
            PARENT="$(git rev-parse --verify "$TAG_SHA^1" 2>/dev/null || true)"
            if [ "$TAG_SHA" = "$SRC_SHA" ] || [ "$PARENT" = "$SRC_SHA" ]; then
              echo "v$VERSION ya existe para este commit fuente ($SRC_SHA); se omite commit, tag y push."
              echo "v$VERSION ya existe para este commit fuente ($SRC_SHA); se omite commit, tag y push." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::El tag v$VERSION ya existe en $TAG_SHA, pero esta corrida libera $SRC_SHA" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # `[skip image]` cierra el bucle: el `if` del job ignora este push.
          git commit -m "chore(release): $VERSION [skip image]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main --follow-tags
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.released == 'true'
      - uses: docker/login-action@v3
        if: steps.release.outputs.released == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.release.outputs.released == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          docker buildx build --build-context kit=./vendor/kit \
            --label org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            --annotation org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            --annotation index:org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            --annotation manifest:org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            -t ghcr.io/opus-perpetuus/subject-vehiculos:"$VERSION" \
            -t ghcr.io/opus-perpetuus/subject-vehiculos:latest \
            --push \
            .
      # Notify n8n / pin de catálogo RETIRADO (2026-10-27):
      # versiones de apps = discovery + app_registry.installed_tag (100% dinámico).
