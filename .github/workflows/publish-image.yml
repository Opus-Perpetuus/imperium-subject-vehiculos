name: publish-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip image]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker buildx build --build-context kit=./vendor/kit \
            --label org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            --annotation org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            --annotation index:org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            --annotation manifest:org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-vehiculos \
            -t ghcr.io/opus-perpetuus/subject-vehiculos:0.1.0 \
            -t ghcr.io/opus-perpetuus/subject-vehiculos:latest \
            --push \
            .
      - name: Notify n8n
        continue-on-error: true
        env:
          HOOK: ${{ secrets.SUBJECT_N8N_WEBHOOK }}
          DEFAULT_HOOK: https://nochon.codice-progressio.online/webhook/imperium-subject
        run: |
          HOOK="${HOOK:-$DEFAULT_HOOK}"
          curl -fsS -X POST "$HOOK" \
            -H "Content-Type: application/json" \
            -d "{\"slug\":\"vehiculos\",\"image\":\"ghcr.io/opus-perpetuus/subject-vehiculos:0.1.0\",\"tag\":\"0.1.0\",\"sha\":\"${{ github.sha }}\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
